name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(any(.targets[]; .name == "kedu" and (.kind | index("bin")))) | .version' | head -1)
          test -n "$PACKAGE_VERSION"
          test "$PACKAGE_VERSION" = "${RELEASE_VERSION#v}"

      - name: Build release archive
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: ./scripts/package-release.sh "${{ matrix.target }}" "${RELEASE_VERSION#v}"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: kedu-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kedu-*
          path: dist
          merge-multiple: true

      - name: Create checksum manifest
        working-directory: dist
        run: shasum -a 256 *.tar.gz > checksums.txt

      - name: Verify archives
        working-directory: dist
        run: shasum -a 256 -c checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/checksums.txt
