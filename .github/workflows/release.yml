name: Release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - scripts/package-release.sh
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: macos-14
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version
        id: package
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(any(.targets[]; .name == "kedu" and (.kind | index("bin")))) | .version' | head -1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure version is not already released
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already exists; bump the Cargo package version before releasing" >&2
            exit 1
          fi

  build:
    needs: prepare
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Build release archive
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/package-release.sh "${{ matrix.target }}" "$RELEASE_VERSION"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: kedu-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kedu-*
          path: dist
          merge-multiple: true

      - name: Create checksum manifest
        working-directory: dist
        run: shasum -a 256 *.tar.gz > checksums.txt

      - name: Verify archives
        working-directory: dist
        run: shasum -a 256 -c checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/checksums.txt
